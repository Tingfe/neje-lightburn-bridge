name: macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'packaging/**'
      - 'assets/**'
      - 'neje-gui.spec'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'packaging/**'
      - 'assets/**'
      - 'neje-gui.spec'
      - '.github/workflows/macos-build.yml'

permissions:
  contents: read

jobs:
  build:
    # Two runners so the release covers every Mac: GitHub's macos-15 label is Apple
    # Silicon, macos-13 is Intel. Each job builds, self-verifies and uploads its own
    # package; one failing architecture does not hide the other.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-macos.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Offline regression (no BLE device)
        run: python -m unittest discover -s tests -v
      - name: Build and verify self-contained app
        run: sh packaging/build-macos.sh python dist/macos-app
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NEJE-Bridge-macOS-${{ matrix.arch }}
          path: |
            dist/macos-app/*.zip
            dist/macos-app/SHA256SUMS.txt
            dist/macos-app/build-metadata.json
            dist/macos-app/bundle-diagnostics.json
          if-no-files-found: error
          retention-days: 30
