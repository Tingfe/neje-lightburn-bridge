name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip bleak
      - name: Install Tcl/Tk runtime for offline desktop tests
        run: sudo apt-get update && sudo apt-get install -y tk8.6
      - name: Run the offline test suite
        run: python -m unittest discover -s tests -v
      - name: Confirm the tools parse
        run: |
          python tools/neje.py --dry-run
          python tools/neje.py --help >/dev/null
          python tools/emergency_stop.py >/dev/null
